name: CVA leads

# Companies currently in a Company Voluntary Arrangement, run through the FX
# triage. These are businesses banks often will not give a forward facility,
# which is the segment Lumon's credit appetite is aimed at, so the usual
# winnability screen is deliberately skipped. The triage still runs, so you
# only get CVA companies that also buy or sell in currency.

on:
  workflow_dispatch:
    inputs:
      max_results:
        description: "How many CVA companies to pull before triage"
        required: true
        default: "300"
      no_brief:
        description: "Skip the paid AI brief (cheaper, less detail)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cva:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests

      - name: Discover and triage CVA companies
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          STAMP=$(date +%Y-%m-%d)
          BRIEF=""
          if [ "${{ github.event.inputs.no_brief }}" = "true" ]; then BRIEF="--no-brief"; fi
          python run_discover.py --cva \
            --max "${{ github.event.inputs.max_results }}" \
            --out-list "cva_discovered_${STAMP}.csv" \
            --out "cva_call_sheet_${STAMP}.csv" \
            $BRIEF

      - name: Build the Lusha lookup list
        run: |
          python - <<'PY'
          import csv, glob, re
          sheets=sorted(glob.glob("cva_call_sheet_*.csv"))
          if not sheets:
              print("no call sheet produced"); raise SystemExit(0)
          latest=sheets[-1]
          rows=[r for r in csv.DictReader(open(latest,encoding="utf-8-sig"))
                if r.get("call_rank") in ("1","2","3")]
          def tidy(n):
              n=re.sub(r"\s*\([^)]*\)","",n)
              n=re.sub(r"\s*,?\s*(LIMITED|LTD|PLC|LLP)\.?$","",n,flags=re.I).strip(" .,")
              return n.title() if n.isupper() else n
          with open("cva_lusha.csv","w",encoding="utf-8-sig",newline="") as fh:
              w=csv.writer(fh); w.writerow(["company"])
              for r in rows: w.writerow([tidy(r["company"])])
          print(f"{len(rows)} callable CVA companies written to cva_lusha.csv")
          PY

      - name: Commit the results
        run: |
          git config user.name "cva-bot"
          git config user.email "actions@github.com"
          git add cva_call_sheet_*.csv cva_discovered_*.csv cva_lusha.csv ch_results_cache.jsonl 2>/dev/null || true
          git commit -m "CVA leads run $(date +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "nothing to push"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cva-leads
          path: |
            cva_call_sheet_*.csv
            cva_lusha.csv
