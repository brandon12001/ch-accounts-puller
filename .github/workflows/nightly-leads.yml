name: Nightly lead run

# Runs every vertical in parallel overnight so the call list is full by morning.
#
# The volume target is 500 dials a day. One vertical a night produced about 60
# qualified companies, nowhere near enough. Twelve in parallel triages roughly
# 3,000 companies, which at the observed 24% qualification rate and 80% contact
# hit rate lands around 430 callable people in the Lusha table each morning.
#
# Three things make the parallelism safe:
#
#   Each job writes its own cache shard. Twelve jobs committing one file to one
#   branch is how the results cache was lost on 17 August: the push failed, the
#   error was swallowed by "|| echo nothing to push", and 1,249 companies never
#   landed. Shards are merged by a single job at the end, so nothing races.
#
#   Each job reads the shared cache first, so a company already seen in any
#   earlier run is skipped before any money is spent reading its accounts.
#
#   Companies House allows 600 requests per five minutes per key. Each job makes
#   roughly five a minute, so fourteen running at once sit near 350 per five
#   minutes. There are twenty verticals in the matrix but max-parallel caps
#   concurrency at fourteen, so the last six queue and start as others finish.
#   That keeps the API inside its limit and spreads the load across the night.
#   Do not raise max-parallel without a second CH key.

on:
  schedule:
    # 22:00 UTC Sunday to Thursday, so a long run still finishes overnight.
    # GitHub caps any single job at six hours regardless of when it starts.
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      max_results:
        description: "Companies per vertical that file FULL/MEDIUM/GROUP accounts"
        required: false
        default: "450"
      verticals:
        description: "Comma separated, or blank for all of them"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # One job per vertical. fail-fast is off: a bad sector must not take
  # the rest of the night down with it.
  # ------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        vertical:
          - "food wholesale"
          - "wholesale import export"
          - "fabricated metal"
          - "food and beverage"
          - "industrial machinery"
          - "chemicals"
          - "plastics and rubber"
          - "electronics and electrical"
          - "furniture and timber"
          - "textiles and apparel"
          - "transport equipment"
          - "glass and ceramics"
          # added 25/08: the original twelve have each had a pass and the
          # qualification rate has fallen from 12% to 7%. These are untouched
          # and chosen for direct import or export rather than UK middlemen.
          - "seafood and fish"
          - "pharma and medical"
          - "automotive parts"
          - "building products"
          - "agriculture and horticulture"
          - "paper and print"
          - "energy and environmental"
          - "marine and offshore"
          # international staffing pays contractors in one currency and bills
          # clients in another, continuously, on both sides
          - "recruitment and staffing"

    steps:
      - uses: actions/checkout@v4

      - name: Skip if this vertical was not requested
        id: gate
        run: |
          want='${{ github.event.inputs.verticals }}'
          if [ -z "$want" ] || echo "$want" | grep -qi "${{ matrix.vertical }}"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "not requested, skipping"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCR system packages
        if: steps.gate.outputs.run == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'yes'
        run: |
          pip install -r requirements.txt
          pip install pypdfium2 pdfplumber pytesseract beautifulsoup4 lxml requests pandas

      - name: Discover and triage
        if: steps.gate.outputs.run == 'yes'
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5
        run: |
          slug=$(echo "${{ matrix.vertical }}" | tr ' ' '_')
          python run_discover.py \
            --vertical "${{ matrix.vertical }}" \
            --max "${{ github.event.inputs.max_results || '450' }}" \
            --min-age 10 \
            --out "nightly_${slug}_$(date +%Y-%m-%d).csv"
          # this job's cache goes to its own shard so the twelve jobs never
          # contend for one file
          if [ -f ch_results_cache.jsonl ]; then
            mkdir -p shards
            cp ch_results_cache.jsonl "shards/${slug}.jsonl"
          fi

      - name: Upload this vertical
        if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.vertical }}
          path: |
            nightly_*.csv
            shards/*.jsonl
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Single job: merge the shards, build one sheet, fill a Lusha table,
  # send the email. Runs even if some verticals failed.
  # ------------------------------------------------------------------
  collect:
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt && pip install pandas requests

      - name: Download every shard
        uses: actions/download-artifact@v4
        with:
          path: incoming
          merge-multiple: true

      - name: Merge into one cache and one sheet
        run: |
          python - <<'PY'
          import csv, glob, json, pathlib

          # merge the shards, keeping the richest record for each company
          seen = {}
          paths = ["ch_results_cache.jsonl"]
          paths += glob.glob("incoming/**/*.jsonl", recursive=True)
          for path in paths:
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              for line in p.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  try:
                      rec = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  key = str(rec.get("number") or rec.get("company", "")).lower()
                  if not key:
                      continue
                  weight = len(str(rec.get("call_ammo", "")))
                  cur = seen.get(key)
                  if cur is None or weight > len(str(cur.get("call_ammo", ""))):
                      seen[key] = rec

          with open("ch_results_cache.jsonl", "w", encoding="utf-8") as fh:
              for rec in seen.values():
                  fh.write(json.dumps(rec, ensure_ascii=False) + "\n")
          print(f"cache now holds {len(seen)} companies")

          # stack tonight's sheets into one
          rows, header = [], None
          for f in sorted(glob.glob("incoming/**/nightly_*.csv", recursive=True)):
              with open(f, encoding="utf-8-sig", newline="") as fh:
                  batch = list(csv.DictReader(fh))
              if batch:
                  header = header or list(batch[0])
                  rows.extend(batch)
          print(f"{len(rows)} companies triaged tonight")
          if rows:
              with open("tonight.csv", "w", encoding="utf-8-sig", newline="") as fh:
                  w = csv.DictWriter(fh, fieldnames=header)
                  w.writeheader()
                  w.writerows(rows)
          PY

      - name: Build the call sheet
        run: |
          python build_call_sheet.py \
            --contacts tonight.csv \
            --cache ch_results_cache.jsonl \
            --out "call_sheet_$(date +%Y-%m-%d).csv"

      - name: Push companies into a new Lusha table
        id: lusha
        continue-on-error: true
        env:
          LUSHA_API_KEY: ${{ secrets.LUSHA_API_KEY }}
        run: |
          python push_to_lusha.py \
            --sheet "call_sheet_$(date +%Y-%m-%d).csv" \
            --vertical "all verticals" \
            --min-rank 2

      - name: Commit the merged cache and sheet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ch_results_cache.jsonl call_sheet_*.csv || true
          git diff --staged --quiet && exit 0
          git commit -m "nightly: all verticals, run ${{ github.run_number }}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((i * 10))
          done
          echo "::error::could not push the merged cache after 5 attempts"
          exit 1

      - name: Email the call sheet
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Lead run
          to: brandon879@hotmail.co.uk
          subject: "Call sheet - ${{ steps.lusha.outputs.contacts_found }} contacts"
          body: |
            Last night's run across all verticals.

            Lusha table (${{ steps.lusha.outputs.contacts_found }} contacts):
            ${{ steps.lusha.outputs.table_url }}

            Open it, select all, push to Salesforce.

            The call sheet is attached. Read call_rank first:
              1  evidence of exposure in the accounts, nothing held against it
              2  no disclosure, but the sector and size say they buy abroad
          attachments: call_sheet_*.csv

      - name: Upload everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-combined
          path: |
            call_sheet_*.csv
            tonight.csv
            ch_results_cache.jsonl
          retention-days: 30
