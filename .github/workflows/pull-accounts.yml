name: Pull accounts and triage

# Runs the Companies House triage on a GitHub runner rather than Streamlit
# Community Cloud: several cores, no CPU throttle, no browser session to drop.
#
# Fire it from the Actions tab. Results come back as a downloadable artifact
# and the results cache is committed so nothing is ever processed twice.

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Input CSV in the repo root (needs a 'name' column)"
        required: true
        default: "ch_run_list2.csv"
      limit:
        description: "Max companies this run (0 = all outstanding)"
        required: false
        default: "0"
      briefs:
        description: "Run the AI briefs (costs Anthropic credits)"
        type: boolean
        default: false

permissions:
  contents: write          # so the results cache can be committed back

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub kills the job at 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCR system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils
          tesseract --version

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pypdfium2 pdfplumber pytesseract beautifulsoup4 lxml requests pandas

      - name: Run the batch
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5
        run: |
          python run_batch.py \
            --input "${{ github.event.inputs.input_file }}" \
            --out "call_sheet_$(date +%d-%m-%Y_%H%M).csv" \
            --limit "${{ github.event.inputs.limit }}" \
            ${{ github.event.inputs.briefs == 'true' && ' ' || '--no-brief' }}

      # always: without this a timed-out or failed run loses every result
      - name: Upload the call sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-results
          path: |
            call_sheet*.csv
            ch_results_cache.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Commit results cache
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ch_results_cache.jsonl || true
          if git diff --staged --quiet; then
            echo "cache unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "cache: run ${{ github.run_number }}"
          # a long run means main has probably moved, so rebase before pushing.
          # Retry, because two workflows finishing together will collide.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((i * 5))
          done
          echo "::error::could not push the results cache after 5 attempts."
          echo "::error::Download the artifact and commit ch_results_cache.jsonl by hand."
          exit 1
