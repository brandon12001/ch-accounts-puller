name: Discover new companies

# Generates a prospect list straight from Companies House rather than buying
# one, then triages it. Filters on SIC code, location, active status and
# incorporation date, all free and unlimited.
#
# Anything already in the results cache is dropped before triage, so running
# the same vertical twice only ever surfaces companies not seen before.

on:
  workflow_dispatch:
    inputs:
      vertical:
        description: "Sector to search"
        type: choice
        required: true
        default: "food wholesale"
        options:
          - "food wholesale"
          - "food and beverage"
          - "wholesale import export"
          - "fabricated metal"
          - "industrial machinery"
          - "chemicals"
          - "plastics and rubber"
          - "textiles and apparel"
          - "furniture and timber"
          - "electronics and electrical"
          - "glass and ceramics"
          - "transport equipment"
      location:
        description: "Town, city or region. Leave blank to search nationally"
        required: false
        default: ""
      max_results:
        description: "How many companies that file FULL/GROUP/MEDIUM accounts to find"
        required: false
        default: "100"
      min_age_years:
        description: "Skip companies incorporated more recently than this"
        required: false
        default: "10"
      all_sizes:
        description: "Include small and micro filers (normally leave unticked)"
        type: boolean
        default: false
      briefs:
        description: "Run the AI briefs (needed for turnover and call angles)"
        type: boolean
        default: true
      triage_limit:
        description: "Cap how many get triaged (0 = all found)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCR system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pypdfium2 pdfplumber pytesseract beautifulsoup4 lxml requests pandas

      - name: Discover and triage
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5
        run: |
          SLUG=$(echo "${{ github.event.inputs.vertical }}${{ github.event.inputs.location }}" | tr -c '[:alnum:]' '_')
          python run_discover.py \
            --vertical "${{ github.event.inputs.vertical }}" \
            --location "${{ github.event.inputs.location }}" \
            --max "${{ github.event.inputs.max_results }}" \
            --min-age "${{ github.event.inputs.min_age_years }}" \
            --triage-limit "${{ github.event.inputs.triage_limit }}" \
            ${{ github.event.inputs.all_sizes == 'true' && '--all-sizes' || ' ' }} \
            --out-list "discovered_${SLUG}_$(date +%d-%m-%Y).csv" \
            --out "call_sheet_${SLUG}_$(date +%d-%m-%Y_%H%M).csv" \
            ${{ github.event.inputs.briefs == 'true' && ' ' || '--no-brief' }}

      # always: a timed-out run still hands back whatever it finished
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-companies
          path: |
            discovered_*.csv
            call_sheet_*.csv
            ch_results_cache.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Commit results cache
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ch_results_cache.jsonl || true
          git diff --staged --quiet || git commit -m "discover: ${{ github.event.inputs.vertical }} run ${{ github.run_number }}"
          git push || echo "nothing to push"
